services:
  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: car2hand-minio
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-car2hand}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-car2hand123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - car2hand-network

  # MinIO Client - สร้าง bucket อัตโนมัติเมื่อเริ่มต้น
  minio-init:
    image: minio/mc:latest
    container_name: car2hand-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-car2hand} $${MINIO_ROOT_PASSWORD:-car2hand123}; mc mb myminio/uploads --ignore-existing; mc anonymous set download myminio/uploads; mc mb myminio/brands --ignore-existing; mc anonymous set download myminio/brands; echo 'Buckets uploads and brands created successfully!'; exit 0; "
    networks:
      - car2hand-network

  postgres:
    image: postgres:15-alpine
    container_name: car2hand-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-car2hand}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-car2hand123}
      POSTGRES_DB: ${POSTGRES_DB:-car2hand}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-car2hand} -d $${POSTGRES_DB:-car2hand}" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - car2hand-network

volumes:
  minio_data:
    driver: local
  postgres_data:
    driver: local

networks:
  car2hand-network:
    driver: bridge
